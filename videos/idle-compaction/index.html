<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0f0f12;
        --ink: #f5f1e8;
        --muted: #9a968c;
        --accent: #ff7a45;
        --cool: #7aa2ff;
        --font-display: "Archivo Black";
        --font-body: "Inter";
        --font-mono: "JetBrains Mono";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 700px at 80% 15%, rgba(255, 122, 69, 0.16), transparent 70%),
          radial-gradient(800px 800px at 10% 85%, rgba(122, 162, 255, 0.12), transparent 70%),
          var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="17.5"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="17.5" data-track-index="0"></div>
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="problem"
        data-composition-id="problem"
        data-composition-src="compositions/problem.html"
        data-start="3.5"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="fix"
        data-composition-id="fix"
        data-composition-src="compositions/fix.html"
        data-start="8"
        data-duration="5.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="payoff"
        data-composition-id="payoff"
        data-composition-src="compositions/payoff.html"
        data-start="13.5"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
